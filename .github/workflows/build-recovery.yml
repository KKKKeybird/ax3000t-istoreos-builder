name: Build AX3000T recovery initramfs (fast)

# Builds a MINIMAL bootable initramfs, not a full firmware.
#
# Rationale: the device boots a TFTP-delivered initramfs ("blue LED") but its
# Linux-side LAN was never reachable, so there was no way to log in and persist a
# firmware with sysupgrade. The image produced here carries
# /usr/sbin/ax3000t-autoflash, which on boot finds whichever Ethernet port has
# carrier, HTTP-fetches the sysupgrade image from the recovery PC, verifies a
# pinned sha256 and flashes it. No login, no serial, no working LAN required.
#
# Uses OpenWrt's ImageBuilder, which only ASSEMBLES a prebuilt kernel and
# prebuilt packages, so it takes minutes rather than the ~3 h a full iStoreOS
# source build needs: no OpenClash, no Ruby, no toolchain.

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release used for the ImageBuilder"
        required: false
        default: "24.10.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout builder configuration
        uses: actions/checkout@v4

      - name: Install ImageBuilder
        run: |
          set -eux
          VER="${{ inputs.openwrt_version }}"
          IB="openwrt-imagebuilder-${VER}-mediatek-filogic.Linux-x86_64"
          BASE="https://downloads.openwrt.org/releases/${VER}/targets/mediatek/filogic"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

          # Older releases ship .tar.xz, 24.10+ ships .tar.zst. Probe both.
          got=""
          for ext in tar.zst tar.xz; do
            if curl -fsSL -o ib.archive "$BASE/${IB}.${ext}"; then
              got="$ext"; break
            fi
          done
          test -n "$got"
          echo "downloaded ${IB}.${got}"
          ls -l ib.archive

          case "$got" in
            tar.zst) tar --zstd -xf ib.archive ;;
            tar.xz)  tar -xJf ib.archive ;;
          esac
          test -d "$IB"
          echo "IB=$IB" >> "$GITHUB_ENV"

      - name: Work around ImageBuilder rootfs.mk empty-statement bug
        run: |
          set -x
          cd "$IB"

          # --- diagnose what this ImageBuilder actually bundles ---
          ls -l staging_dir/host/bin/ | grep -E ' (apk|opkg)$' || true
          grep -in 'CONFIG_USE_APK' .config || echo "NO CONFIG_USE_APK IN .config"

          # --- the actual defect ---
          # include/rootfs.mk expands $(CONFIG_USE_APK) into generated shell:
          #     if [ -z "$(CONFIG_USE_APK)" ]; then
          #         $(if $(IB),,awk -i inplace ...)
          #         $(if $(SOURCE_DATE_EPOCH),sed -i ... ;)
          #     fi
          # With CONFIG_USE_APK unset AND IB set (a normal ImageBuilder run), BOTH
          # inner expressions expand to nothing, leaving
          #     if [ -z "" ]; then  ; fi
          # which is a bash SYNTAX error -> make dies in prepare_rootfs.
          #
          # DO NOT "fix" this by writing CONFIG_USE_APK=y into .config on a release
          # that bundles opkg: defconfig then believes the target uses apk, and
          # `make image` dies earlier in package_index with fakeroot Error 127.
          # (That was a bug in the previous revision of this workflow.)
          #
          # Neutralising the empty statement is correct and safe: adding ":" makes
          # it valid shell no matter which branch the expansion takes.
          cp include/rootfs.mk include/rootfs.mk.orig
          sed -i 's/then \\$/then :; \\/' include/rootfs.mk
          sed -i 's/then \\\r$/then :; \\/' include/rootfs.mk

          # Second, separate empty then-branch in the same macro:
          #   if [ -z "$(CONFIG_USE_APK)" ]; then
          #       $(if $(IB),,awk -i inplace ...)        <- IB unset  -> empty
          #       $(if $(SOURCE_DATE_EPOCH),sed -i ... ;) <- SET by OpenWrt -> this
          #   fi                                           line collapses to " ;"
          # The generated text observed in CI was literally
          #   if [ -z "" ]; then :;  ; sed -i "s/Installed-Time: ...
          # so collapse any "then <whitespace> ;" back into a valid empty command.
          perl -0pi -e 's/\bthen\s+;/then :;/g' include/rootfs.mk

          diff -u include/rootfs.mk.orig include/rootfs.mk || true
          echo "then-guards: $(grep -c 'then :;' include/rootfs.mk)"
          echo "empty-then remaining: $(grep -c 'then  *;' include/rootfs.mk || true)"
          grep -n 'then :;' include/rootfs.mk

      - name: Assemble rootfs overlay (auto-flasher)
        run: |
          set -eux
          mkdir -p "$IB/files/etc/init.d" "$IB/files/etc/config" "$IB/files/usr/sbin" "$IB/files/etc/uci-defaults"

          # The flashing logic. Shared by the manual entry point and the init script.
          cp files/usr/sbin/ax3000t-autoflash "$IB/files/usr/sbin/ax3000t-autoflash"
          chmod 0755 "$IB/files/usr/sbin/ax3000t-autoflash"

          # Boot-time runner (procd). START=99 so it runs after networking.
          printf '%s\n' \
            '#!/bin/sh /etc/rc.common' \
            'START=99' \
            'STOP=99' \
            'USE_PROCD=1' \
            '' \
            'start_service() {' \
            '	procd_open_instance' \
            '	procd_set_param command /usr/sbin/ax3000t-autoflash' \
            '	procd_set_param stdout 1' \
            '	procd_set_param stderr 1' \
            '	procd_close_instance' \
            '}' \
            > "$IB/files/etc/init.d/ax3000t-autoflash"
          chmod 0755 "$IB/files/etc/init.d/ax3000t-autoflash"

          # Belt and braces: uci-defaults runs early even if procd services are not
          # yet enabled, and starts the flasher in the background so boot is never
          # blocked by a slow or hung network.
          printf '%s\n' \
            '#!/bin/sh' \
            '/etc/init.d/ax3000t-autoflash enable 2>/dev/null' \
            '( sleep 5; /usr/sbin/ax3000t-autoflash ) >/dev/null 2>&1 &' \
            'exit 0' \
            > "$IB/files/etc/uci-defaults/99-ax3000t-autoflash"
          chmod 0755 "$IB/files/etc/uci-defaults/99-ax3000t-autoflash"

          cp files/etc/config/ax3000t-recovery "$IB/files/etc/config/ax3000t-recovery"

          # Assertions: a silent packaging failure must fail CI, not the router.
          test -x "$IB/files/usr/sbin/ax3000t-autoflash"
          test -x "$IB/files/etc/init.d/ax3000t-autoflash"
          test -x "$IB/files/etc/uci-defaults/99-ax3000t-autoflash"
          test -f "$IB/files/etc/config/ax3000t-recovery"
          head -n1 "$IB/files/etc/init.d/ax3000t-autoflash" | grep -q '/etc/rc.common'
          grep -q 'ax3000t-autoflash' "$IB/files/usr/sbin/ax3000t-autoflash"
          grep -q '51ac8c2ecbc14b563aec938cc2d7ed408a8a40d2f153da6863124dad08def4a9' \
               "$IB/files/etc/config/ax3000t-recovery"

      - name: Build the image
        run: |
          set -eux
          cd "$IB"
          make image PROFILE=xiaomi_mi-router-ax3000t PACKAGES="curl ca-bundle"
          ls -l bin/targets/mediatek/filogic/

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p dist
          find "$IB/bin/targets/mediatek/filogic" -maxdepth 1 -type f \
            \( -name '*initramfs-kernel.bin' -o -name '*initramfs-factory.ubi' \) \
            -exec cp -v {} dist/ \;
          ls -l dist/
          ( cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-recovery-initramfs
          path: dist/
