name: Build iStoreOS for Xiaomi AX3000T RD03

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ISTOREOS_COMMIT: fb971407ffd9a094e6f16d9c029f1f580ed5c2ad
  # vernesong/OpenClash tag v0.47.156
  OPENCLASH_COMMIT: c3a33c1d3407956fdf8f0e0b7c1a4c52e6ad9593
  # Largest rootfs, in 126976-byte UBI LEBs, that this image may have.
  #
  # An upgrade deletes the running rootfs and then recreates the new one, and it
  # can only reuse the space the old rootfs freed unless /overlay was unmounted
  # (which only happens with `sysupgrade -n`). 139 LEB is the size of the rootfs
  # volume currently installed on the target device, so staying under it means
  # the upgrade succeeds whether or not -n is passed. Going over is what bricked
  # the device: see docs/recovery/ROOT-CAUSE-sysupgrade-rootfs.md.
  #
  # After a successful flash the installed volume grows to the new image's size,
  # so this can be raised to match - but only after that image is actually on the
  # device, never before.
  MAX_ROOTFS_LEB: 139

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 rsync \
            unzip zlib1g-dev file wget time qemu-utils libelf-dev

      - name: Fetch pinned iStoreOS source
        run: |
          git clone --branch istoreos-24.10 --single-branch \
            https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          git checkout "$ISTOREOS_COMMIT"
          test "$(git rev-parse HEAD)" = "$ISTOREOS_COMMIT"

      - name: Update and install feeds
        working-directory: istoreos
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          for feed in feeds/*; do
            printf '%s %s\n' "$feed" "$(git -C "$feed" rev-parse HEAD)"
          done | tee feeds-pinned.txt

      - name: Add pinned OpenClash package
        run: |
          git clone --branch v0.47.156 --single-branch \
            https://github.com/vernesong/OpenClash.git openclash-source
          git -C openclash-source checkout "$OPENCLASH_COMMIT"
          test "$(git -C openclash-source rev-parse HEAD)" = "$OPENCLASH_COMMIT"
          cp -a openclash-source/luci-app-openclash istoreos/package/
          test -f istoreos/package/luci-app-openclash/Makefile
          # The init script is mode 100644 in the OpenClash tree on purpose: its
          # Build/Prepare does `chmod 0755` on the copy inside PKG_BUILD_DIR. So
          # assert its content, not its mode, and set the mode ourselves so the
          # source tree is not the odd one out.
          init=istoreos/package/luci-app-openclash/root/etc/init.d/openclash
          test -f "$init"
          grep -q 'openclash' "$init"
          chmod 0755 "$init"

          # Drop the two bundled web dashboards (zashboard 4.34 MB + metacubexd
          # 3.22 MB uncompressed, 2.77 MB compressed). They are pure static web
          # apps, and OpenClash can fetch any of its four dashboards on demand
          # from the LuCI page via openclash_download_dashboard.sh, so nothing is
          # lost that cannot be reinstalled in one click - zashboard is even
          # fetched as the gh-pages-cdn-fonts variant, which ships no bundled
          # font. The LuCI controller only tests `fs.isdirectory` on each
          # dashboard path, so their absence degrades cleanly.
          #
          # Why this matters: see docs/recovery/ROOT-CAUSE-sysupgrade-rootfs.md.
          # A rootfs larger than the installed rootfs volume makes `sysupgrade`
          # delete rootfs and then fail to recreate it. Trimming the dashboards
          # takes the rootfs from 153 LEB to roughly 131 LEB, under the 139 LEB
          # of the currently installed volume, so the upgrade succeeds with or
          # without -n. The size assertion at the end of the build enforces this.
          ocroot=istoreos/package/luci-app-openclash/root/usr/share/openclash
          rm -rf "$ocroot/ui/zashboard" "$ocroot/ui/metacubexd"
          test -f "$ocroot/openclash_download_dashboard.sh"
          test -f "$ocroot/openclash.sh"
          test ! -e "$ocroot/ui/zashboard"
          test ! -e "$ocroot/ui/metacubexd"

          # Its Build/Prepare calls po2lmo, which luci-base installs as a host
          # tool. Normal LuCI packages inherit `PKG_BUILD_DEPENDS += ... luci-base/host`
          # from luci.mk, but this Makefile includes package.mk directly and so
          # declares nothing, letting the package build race ahead of luci-base's
          # host install. Add the dependency explicitly.
          m=istoreos/package/luci-app-openclash/Makefile
          grep -q 'PKG_BUILD_DEPENDS' "$m" || \
            sed -i 's#^PKG_BUILD_DIR:=#PKG_BUILD_DEPENDS:=luci-base/host\nPKG_BUILD_DIR:=#' "$m"
          grep -qx 'PKG_BUILD_DEPENDS:=luci-base/host' "$m"

          # Drop `+ruby +ruby-yaml` from OpenClash's DEPENDS. Compiling Ruby from
          # source is by far the most expensive thing this build does - the
          # interpreter plus ten extension packages, each re-entering Ruby's own
          # build system - and it accounted for about two hours of the last run.
          # The identical prebuilt aarch64_cortex-a53 packages are shipped in
          # files/ instead, so nothing needs to compile it.
          #
          # This is safe because the image rootfs is assembled with
          # `opkg install <ipk list>` and package dependencies are resolved from
          # the generated control files: with ruby gone from DEPENDS, nothing
          # asks opkg for it. The files/ overlay is then applied on top of that
          # rootfs by prepare_rootfs, which is where our copy lands.
          # Plain substring substitution: no capture groups and no anchors, so
          # it behaves identically under GNU sed (the runner) and BSD sed, which
          # is what a local dry run of this file uses.
          sed -i 's/+ruby +ruby-yaml //' "$m"
          grep -q '+kmod-tun +unzip' "$m"
          ! grep -qE '\+ruby' "$m"

      - name: Install rootfs overlay (UU vendor plugin + prebuilt Ruby)
        run: |
          # files/ is OpenWrt's rootfs overlay: everything under it lands at the
          # same path in the image, after the packages are installed.
          mkdir -p istoreos/files
          cp -a files/. istoreos/files/
          # git preserves the exec bit, but make it explicit: these are scripts.
          chmod 0755 istoreos/files/etc/init.d/uu-identity \
                     istoreos/files/etc/init.d/uuplugin \
                     istoreos/files/etc/uci-defaults/99-uu-vendor \
                     istoreos/files/usr/sbin/uu/uuplugin_monitor.sh \
                     istoreos/files/usr/bin/ruby \
                     istoreos/files/usr/lib/ruby/ruby3.3-bin \
                     istoreos/files/usr/sbin/ax3000t-autoflash \
                     istoreos/files/etc/init.d/ax3000t-autoflash

          # ---- recovery auto-flasher ----
          # Boots, finds whichever Ethernet port has carrier, HTTP-fetches the
          # sysupgrade image from the recovery PC, verifies a pinned sha256 and
          # flashes it. This is what makes recovery possible without serial and
          # without a reachable LAN. Asserted so a silent packaging failure is
          # caught in CI rather than on the router.
          test -x istoreos/files/usr/sbin/ax3000t-autoflash
          test -x istoreos/files/etc/init.d/ax3000t-autoflash
          test -f istoreos/files/etc/config/ax3000t-recovery
          grep -q "ax3000t-autoflash" istoreos/files/usr/sbin/ax3000t-autoflash

          # ---- UU Game Booster ----
          test -f istoreos/files/usr/sbin/uu/uu.tar.gz
          test -f istoreos/files/usr/sbin/uu/uu.tar.gz.md5
          test -x istoreos/files/etc/init.d/uu-identity
          test -x istoreos/files/etc/init.d/uuplugin
          # files/ cannot register services by itself, and /etc/rc.d symlinks
          # cannot be created through every upload path. Enabling both services
          # from uci-defaults is the canonical fix and is early enough: it runs
          # from /etc/init.d/boot (START=10), well before rcS reaches S99.
          test -x istoreos/files/etc/uci-defaults/99-uu-vendor
          # The shipped tarball must match the md5 the monitor will check.
          ( cd istoreos/files/usr/sbin/uu && \
            test "$(md5sum uu.tar.gz | cut -d' ' -f1)" = "$(cat uu.tar.gz.md5)" )
          # And it must be the H3C vendor build, not UU's generic one.
          test "$(tar tzf istoreos/files/usr/sbin/uu/uu.tar.gz | wc -l)" -eq 3
          tar tzf istoreos/files/usr/sbin/uu/uu.tar.gz | grep -qx 'uuplugin'

          # ---- prebuilt Ruby ----
          # /usr/bin/ruby is a shim that execs /usr/lib/ruby/ruby3.3-bin.
          test -x istoreos/files/usr/bin/ruby
          grep -q 'ruby3.3-bin' istoreos/files/usr/bin/ruby
          test -x istoreos/files/usr/lib/ruby/ruby3.3-bin
          test -f istoreos/files/usr/lib/libruby.so.3.3.10
          test -f istoreos/files/usr/lib/libyaml-0.so.2.0.9
          # libruby and libyaml are reached through symlinks; a symlink cannot be
          # created through every upload path, so assert them rather than
          # shipping a ruby that cannot resolve libruby.so.3.3 at runtime.
          test -L istoreos/files/usr/lib/libruby.so.3.3
          test -L istoreos/files/usr/lib/libyaml-0.so.2
          # OpenClash needs YAML at runtime.
          test -f istoreos/files/usr/lib/ruby/3.3/yaml.rb
          test -f istoreos/files/usr/lib/ruby/3.3/psych.rb
          test -f istoreos/files/usr/lib/ruby/3.3/aarch64-linux-gnu/psych.so
          test -f istoreos/files/usr/lib/ruby/3.3/aarch64-linux-gnu/date_core.so
          test "$(find istoreos/files/usr/lib/ruby -type f | wc -l)" -ge 70

      - name: Configure AX3000T stock layout
        working-directory: istoreos
        run: |
          cp ../ax3000t.config .config
          make defconfig
          # Each required symbol is checked on its own and names itself when it
          # fails. A bare `grep -qx` only yields "exit code 1", which says
          # nothing when a dozen symbols are being asserted - and this check has
          # already failed once without revealing which symbol was at fault.
          check() {
            if ! grep -qx "$1" .config; then
              echo "::error::required symbol missing from .config: $1"
              echo "--- what .config actually says about it ---"
              grep -n "${1%%=*}" .config | head -n5 || echo "  (symbol absent from .config entirely)"
              exit 1
            fi
          }
          must_not() {
            if grep -qx "$1" .config; then
              echo "::error::symbol must not be set, but is: $1"
              exit 1
            fi
          }

          check 'CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y'
          check 'CONFIG_PACKAGE_luci-app-store=y'
          check 'CONFIG_PACKAGE_dnsmasq-full=y'
          check '# CONFIG_PACKAGE_dnsmasq is not set'
          check 'CONFIG_PACKAGE_adblock-fast=y'
          check 'CONFIG_PACKAGE_luci-app-adblock-fast=y'
          # TUN is not built into this target's kernel and UU Game Booster needs
          # /dev/net/tun, so the module has to be selected.
          check 'CONFIG_PACKAGE_kmod-tun=y'
          # nft_compat is what makes `iptables-nft -j DNAT/MARK` work at all;
          # without it UU lists devices but refuses to accelerate them.
          check 'CONFIG_PACKAGE_kmod-nft-compat=y'
          check 'CONFIG_PACKAGE_kmod-nf-ipt=y'
          # OpenClash and what its Makefile would otherwise select only
          # implicitly via PACKAGE_firewall4.
          check 'CONFIG_PACKAGE_luci-app-openclash=y'
          check 'CONFIG_PACKAGE_luci-compat=y'
          check 'CONFIG_PACKAGE_kmod-inet-diag=y'
          check 'CONFIG_PACKAGE_kmod-nft-tproxy=y'
          check 'CONFIG_PACKAGE_dnsmasq_full_nftset=y'
          # Runtime libraries the prebuilt Ruby in files/ links against.
          check 'CONFIG_PACKAGE_libgmp10=y'
          check 'CONFIG_PACKAGE_zlib=y'
          # Ruby must not be compiled: files/ supplies it prebuilt.
          must_not 'CONFIG_PACKAGE_ruby=y'
          must_not 'CONFIG_PACKAGE_ruby-yaml=y'

      - name: Download sources
        working-directory: istoreos
        run: |
          make download -j8
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        working-directory: istoreos
        run: |
          # OpenWrt's own output goes silent for many minutes inside a single
          # package, which makes a healthy build look hung (and made a previous
          # run impossible to judge without live logs). Emit a timestamped,
          # monotonically increasing progress line so the log is never silent.
          (
            while true; do
              sleep 120
              echo "[heartbeat $(date -u +%H:%M:%S)] ipk built so far: $(find bin/packages -name '*.ipk' 2>/dev/null | wc -l)"
            done
          ) &
          hb=$!
          make -j"$(nproc)" || make -j1 V=s
          kill "$hb" 2>/dev/null || true

      - name: Validate and collect artifacts
        working-directory: istoreos
        run: |
          # Prove the overlay and OpenClash reached the rootfs staging tree that
          # the images are packed from, not just the build inputs.
          rootfs="$(ls -d build_dir/target-*/root-* 2>/dev/null | head -n1)"
          test -n "$rootfs"
          echo "rootfs staging: $rootfs"
          test -f "$rootfs/usr/sbin/uu/uu.tar.gz"
          test -f "$rootfs/usr/sbin/uu/uu.tar.gz.md5"
          test -x "$rootfs/usr/sbin/uu/uuplugin_monitor.sh"
          test -x "$rootfs/etc/init.d/uu-identity"
          test -x "$rootfs/etc/init.d/uuplugin"
          test -x "$rootfs/etc/uci-defaults/99-uu-vendor"
          # The serial is derived at boot from br-lan's MAC, so only the script
          # that writes /var/tmp/uu/h3c_info has to be present.
          grep -q 'manucode=' "$rootfs/etc/init.d/uu-identity"
          # prebuilt Ruby really made it into the image
          test -x "$rootfs/usr/bin/ruby"
          test -x "$rootfs/usr/lib/ruby/ruby3.3-bin"
          test -L "$rootfs/usr/lib/libruby.so.3.3"
          test -f "$rootfs/usr/lib/ruby/3.3/yaml.rb"
          # OpenClash app plus its nftables/geo payload.
          test -x "$rootfs/etc/init.d/openclash"
          test -d "$rootfs/usr/share/openclash"
          test -f "$rootfs/etc/openclash/GeoSite.dat"
          # The kmod that unblocks UU acceleration has to be in the image.
          test -f "$rootfs/lib/modules/6.6.144/nft_compat.ko"
          test -f "$rootfs/lib/modules/6.6.144/x_tables.ko"

          # Collect into a *fresh* directory every run. An earlier version wrote
          # into a committed artifacts/ directory that held a previously verified
          # image, so the upload shipped a stale sysupgrade image next to the new
          # one - a genuine "flash the wrong file" hazard. That directory is gone.
          out=../dist
          rm -rf "$out"
          mkdir -p "$out"
          factory="$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*xiaomi_mi-router-ax3000t-initramfs-factory.ubi' | head -n1)"
          sysupgrade="$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*xiaomi_mi-router-ax3000t-squashfs-sysupgrade.bin' | head -n1)"
          test -n "$factory" && test -f "$factory"
          test -n "$sysupgrade" && test -f "$sysupgrade"
          test "$(stat -c%s "$factory")" -lt 33554432
          test "$(stat -c%s "$sysupgrade")" -lt 33554432

          # Guard against the failure mode that bricked the device: a rootfs too
          # big to be recreated in the space deleting the old rootfs frees. Fail
          # the build here rather than let it be discovered by flashing.
          #
          # Size is measured by extracting the member, not by parsing `tar tvf`:
          # GNU tar and BSD tar place the size in different columns, so a column
          # index silently yields 0 on the other flavour.
          root_member="$(tar tf "$sysupgrade" | grep '/root$' | head -n1)"
          test -n "$root_member"
          root_size="$(tar xOf "$sysupgrade" "$root_member" | wc -c)"
          test "$root_size" -gt 0
          root_leb=$(( (root_size + 126976 - 1) / 126976 ))
          echo "rootfs component: ${root_size} bytes = ${root_leb} LEB (limit ${MAX_ROOTFS_LEB})"
          if [ "$root_leb" -gt "$MAX_ROOTFS_LEB" ]; then
            echo "::error::rootfs is ${root_leb} LEB but the limit is ${MAX_ROOTFS_LEB} LEB." \
                 "An in-place sysupgrade would delete rootfs and then fail to recreate it." \
                 "Trim the image, or raise MAX_ROOTFS_LEB only once a smaller image is already installed." >&2
            exit 1
          fi

          cp "$factory" "$sysupgrade" "$out/"
          cp .config "$out/build.config"
          cp feeds-pinned.txt "$out/"
          {
            echo "profile: xiaomi_mi-router-ax3000t (stock layout, not ubootmod)"
            echo "firmware: iStoreOS 24.10.8"
            echo "iStoreOS: $ISTOREOS_COMMIT"
            echo "OpenClash: $OPENCLASH_COMMIT (v0.47.156)"
            echo "UU: H3C NX30 PRO vendor build v14.9.4, uu.tar.gz md5 2afd39af94e5dda55dcfcb4bc220c5ce"
            echo "ruby: 3.3.10-r1 prebuilt, from OpenWrt 24.10.8 aarch64_cortex-a53"
            echo "kernel_abi: 6.6.144"
          } > "$out/BUILD-METADATA.txt"
          ( cd "$out" && sha256sum "$(basename "$factory")" "$(basename "$sysupgrade")" \
              build.config feeds-pinned.txt BUILD-METADATA.txt > SHA256SUMS )
          cat "$out/SHA256SUMS"
          ls -lh "$out"

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-RD03-iStoreOS-stock-layout
          path: dist/
          if-no-files-found: error
          retention-days: 7
