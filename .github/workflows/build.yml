name: Build iStoreOS for Xiaomi AX3000T RD03

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 rsync \
            unzip zlib1g-dev file wget time qemu-utils libelf-dev

      - name: Fetch pinned iStoreOS source
        run: |
          git clone --branch istoreos-24.10 --single-branch \
            https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          git checkout fb971407ffd9a094e6f16d9c029f1f580ed5c2ad
          test "$(git rev-parse HEAD)" = "fb971407ffd9a094e6f16d9c029f1f580ed5c2ad"

      - name: Update and install feeds
        working-directory: istoreos
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          for feed in feeds/*; do
            printf '%s %s\n' "$feed" "$(git -C "$feed" rev-parse HEAD)"
          done | tee feeds-pinned.txt

      - name: Configure AX3000T stock layout
        working-directory: istoreos
        run: |
          cp ../ax3000t.config .config
          make defconfig
          # Check every required symbol separately: a single alternation
          # expression needs only ONE match, so it silently passes when
          # defconfig dropped a requested option.
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-store=y' .config
          grep -qx 'CONFIG_PACKAGE_dnsmasq-full=y' .config
          grep -qx '# CONFIG_PACKAGE_dnsmasq is not set' .config
          grep -qx 'CONFIG_PACKAGE_adblock-fast=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-adblock-fast=y' .config
          # TUN is not built into this target's kernel, and UU Game Booster
          # needs /dev/net/tun, so make sure the module really got selected.
          grep -qx 'CONFIG_PACKAGE_kmod-tun=y' .config

      - name: Download sources
        working-directory: istoreos
        run: |
          make download -j8
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        working-directory: istoreos
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Validate and collect artifacts
        working-directory: istoreos
        run: |
          mkdir -p ../artifacts
          factory="$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*xiaomi_mi-router-ax3000t-initramfs-factory.ubi' | head -n1)"
          sysupgrade="$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*xiaomi_mi-router-ax3000t-squashfs-sysupgrade.bin' | head -n1)"
          test -n "$factory" && test -f "$factory"
          test -n "$sysupgrade" && test -f "$sysupgrade"
          test "$(stat -c%s "$factory")" -lt 33554432
          test "$(stat -c%s "$sysupgrade")" -lt 33554432
          cp "$factory" "$sysupgrade" .config feeds-pinned.txt ../artifacts/
          sha256sum ../artifacts/* | tee ../artifacts/SHA256SUMS
          ls -lh ../artifacts

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-RD03-iStoreOS-stock-layout
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
