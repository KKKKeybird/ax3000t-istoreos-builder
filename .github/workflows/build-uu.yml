name: Build UU Game Booster packages for AX3000T

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ISTOREOS_COMMIT: fb971407ffd9a094e6f16d9c029f1f580ed5c2ad
  UU_LUCI_COMMIT: 434e2d204cf6fadbbb71d4ee214b7a553b2828e5
  UU_CORE_COMMIT: 1065ef4ee242dc1b8abfc724b1bb3b7997ac5a1f

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout builder configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev \
            file wget time qemu-utils libelf-dev

      - name: Fetch pinned iStoreOS source
        run: |
          git clone --branch istoreos-24.10 --single-branch \
            https://github.com/istoreos/istoreos.git istoreos
          git -C istoreos checkout "$ISTOREOS_COMMIT"
          test "$(git -C istoreos rev-parse HEAD)" = "$ISTOREOS_COMMIT"

      - name: Install official feeds
        working-directory: istoreos
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add pinned UU packages
        run: |
          git clone https://github.com/fengqi/luci-app-uugamebooster.git uu-source

          git -C uu-source checkout "$UU_LUCI_COMMIT"
          test "$(git -C uu-source rev-parse HEAD)" = "$UU_LUCI_COMMIT"
          cp -a uu-source/luci-app-uugamebooster istoreos/package/

          git -C uu-source checkout "$UU_CORE_COMMIT"
          test "$(git -C uu-source rev-parse HEAD)" = "$UU_CORE_COMMIT"
          cp -a uu-source/uugamebooster istoreos/package/

          {
            echo "iStoreOS=$ISTOREOS_COMMIT"
            echo "UU-LuCI=$UU_LUCI_COMMIT"
            echo "UU-core=$UU_CORE_COMMIT"
          } > source-commits.txt

      - name: Configure package build
        working-directory: istoreos
        run: |
          cp ../ax3000t.config .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_uugamebooster=m
          CONFIG_PACKAGE_luci-app-uugamebooster=m
          EOF
          make defconfig
          grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y$' .config
          grep -E '^CONFIG_PACKAGE_(uugamebooster|luci-app-uugamebooster)=m$' .config
          grep -E '^CONFIG_PACKAGE_kmod-tun=y$' .config

      - name: Download UU sources
        working-directory: istoreos
        run: |
          make package/uugamebooster/download -j1 V=s
          find dl -type f -size -1024c -print -delete

      - name: Prepare cross toolchain and compile target kernel
        working-directory: istoreos
        run: |
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      - name: Compile UU packages
        working-directory: istoreos
        run: |
          make package/uugamebooster/compile -j"$(nproc)" V=s || \
            make package/uugamebooster/compile -j1 V=s
          make package/luci-app-uugamebooster/compile -j"$(nproc)" V=s || \
            make package/luci-app-uugamebooster/compile -j1 V=s

      - name: Collect and validate packages
        run: |
          rm -rf uu-artifacts inspect
          mkdir -p uu-artifacts inspect
          find istoreos/bin -type f \
            \( -name 'uugamebooster_*.ipk' -o -name 'luci-app-uugamebooster_*.ipk' \) \
            -exec cp -v {} uu-artifacts/ \;

          test "$(find uu-artifacts -maxdepth 1 -name '*.ipk' | wc -l)" -eq 2

          : > uu-artifacts/PACKAGE-CONTROLS.txt
          for package in uu-artifacts/*.ipk; do
            name="$(basename "$package" .ipk)"
            mkdir -p "inspect/$name"
            tar -xf "$package" -C "inspect/$name"
            tar -xOf "inspect/$name/control.tar.gz" ./control \
              | tee -a uu-artifacts/PACKAGE-CONTROLS.txt
          done

          if grep -Eqi 'kmod-(nft-compat|ipt-core|ipt-nat)' uu-artifacts/PACKAGE-CONTROLS.txt; then
            echo 'Forbidden external firewall kmod dependency detected' >&2
            exit 1
          fi

          core_package="$(find uu-artifacts -maxdepth 1 -name 'uugamebooster_*.ipk' | head -n1)"
          core_dir="inspect/$(basename "$core_package" .ipk)"
          tar -tzf "$core_dir/data.tar.gz" | grep -q './usr/bin/uugamebooster'
          tar -tzf "$core_dir/data.tar.gz" | grep -q './usr/bin/xtables-nft-multi'

          cp source-commits.txt uu-artifacts/BUILD-METADATA.txt
          printf '%s\n' 'Target: Xiaomi AX3000T RD03 (aarch64_cortex-a53)' >> uu-artifacts/BUILD-METADATA.txt
          printf '%s\n' 'Policy: user-space packages only; no external kmods' >> uu-artifacts/BUILD-METADATA.txt
          sha256sum uu-artifacts/*.ipk uu-artifacts/PACKAGE-CONTROLS.txt \
            uu-artifacts/BUILD-METADATA.txt | tee uu-artifacts/SHA256SUMS
          ls -lh uu-artifacts

      - name: Upload verified UU packages
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-RD03-UU-Game-Booster
          path: uu-artifacts/
          if-no-files-found: error
          retention-days: 30
